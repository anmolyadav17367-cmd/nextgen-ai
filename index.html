<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextGen AI</title>
<style>
body {
  margin: 0;
  padding: 20px;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { color: #a78bfa; font-size: 38px; }
p { color: #cbd5e1; }
.tools {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  max-width: 500px;
  margin: 25px auto;
}
button {
  padding: 16px;
  border: 1px solid #51417d;
  border-radius: 12px;
  background: #17213a;
  color: white;
  cursor: pointer;
}
textarea {
  width: 90%;
  max-width: 450px;
  height: 90px;
  padding: 12px;
  border-radius: 10px;
}
#result {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 20px auto;
  max-width: 500px;
}
</style>
</head>
<body>

<h1>✦ NextGen AI</h1>
<p>Your All-in-One AI Studio</p>

<div class="tools">
<button onclick="choose('AI Chat')">🤖 AI Chat</button>
<button onclick="choose('AI Image')">🎨 AI Image</button>
<button onclick="choose('AI Video')">🎬 AI Video</button>
<button onclick="choose('AI Writer')">✍️ AI Writer</button>
</div>

<h2 id="heading">Welcome!</h2>

<textarea id="prompt"
placeholder="Type your idea here..."></textarea>
<br><br>
<button onclick="generate()">Get Started →</button>

<div id="result"></div>

<script>
let mode = "AI Chat";

function choose(name) {
  mode = name;
  document.getElementById("heading").innerText = name;
  document.getElementById("prompt").placeholder =
    "Enter your " + name + " prompt...";
  document.getElementById("result").innerText = "";
}


async function generate() {
  const text = document.getElementById("prompt").value.trim();
  const result = document.getElementById("result");

  if (!text) {
    result.innerText = "Please enter your idea first.";
    return;
  }

  if (mode === "AI Chat") {
    result.innerText = "NextGen AI is thinking...";

    try {
      const response = await fetch(
        "https://nextgen-ai-backend.anmolyadav17367.workers.dev",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "AI request failed");
      }

      result.innerText = data.reply || "No reply received.";
    } catch (error) {
  result.innerText = error.message || "Unknown error";
  }

    return;
  }

    if (mode === "AI Image") {
    result.innerText = "AI Image will be connected next.";
  } else if (mode === "AI Video") {
    result.innerText = "AI Video will be connected next.";
  } else {
    result.innerText = "AI Writer will be connected next.";
  }
}
      
</script>

</body>
</html>
